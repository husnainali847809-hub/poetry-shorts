name: Authorized Creator Video Queue

on:
  workflow_dispatch:
    inputs:
      enable_account_source_fetch:
        description: "Enable direct scanning of the seven listed creator profiles"
        required: true
        type: boolean
        default: false
      enable_buffer_posting:
        description: "Enable Buffer queueing"
        required: true
        type: boolean
        default: true
  schedule:
    - cron: "0 2 * * *" # 7 AM Pakistan time

permissions:
  contents: write

concurrency:
  group: authorized-creator-video-queue
  cancel-in-progress: false

jobs:
  queue-creator-video:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install requests yt-dlp
      - name: Scan creator profiles and queue one video
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_CHANNEL_ID: ${{ secrets.BUFFER_CHANNEL_ID }}
          ENABLE_ACCOUNT_SOURCE_FETCH: ${{ github.event_name == 'workflow_dispatch' && (inputs.enable_account_source_fetch && 'true' || 'false') || vars.ENABLE_ACCOUNT_SOURCE_FETCH || 'false' }}
          ENABLE_BUFFER_POSTING: ${{ github.event_name == 'workflow_dispatch' && (inputs.enable_buffer_posting && 'true' || 'false') || vars.ENABLE_BUFFER_POSTING || 'true' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          gh auth setup-git
          python creator_video_queue.py
      - name: Save duplicate-prevention history and imported source manifest
        if: success()
        run: |
          if git diff --quiet -- creator_videos/posted.json creator_videos/manifest.json; then
            echo "No new video was queued or imported."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add creator_videos/posted.json creator_videos/manifest.json
            git commit -m "Update creator video queue state"
            git push
          fi
