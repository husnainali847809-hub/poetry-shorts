name: Authorized Creator Video Queue

on:
  workflow_dispatch:
  schedule:
    # One daily batch run at 06:00 Pakistan time (01:00 UTC).
    - cron: "0 1 * * *"

permissions:
  contents: write

concurrency:
  group: authorized-creator-video-queue
  cancel-in-progress: false

jobs:
  queue-creator-video:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Scan @viral_ai_toon and schedule four Facebook videos
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_CHANNEL_ID: ${{ secrets.BUFFER_CHANNEL_ID }}
          ENABLE_ACCOUNT_SOURCE_FETCH: "true"
          ENABLE_BUFFER_POSTING: "true"
          MIN_VIDEO_VIEWS: "0"
          MIN_VIDEO_ENGAGEMENT: "0"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          gh auth setup-git
          python -u creator_video_queue.py
      - name: Save duplicate-prevention history and source manifest
        if: always()
        run: |
          if git diff --quiet -- creator_videos/posted.json creator_videos/manifest.json; then
            echo "No posting state or manifest changes to save."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add creator_videos/posted.json creator_videos/manifest.json
            git commit -m "Update creator video queue state"
            git push
          fi
