name: Authorized Creator Video Queue

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *" # 7 AM Pakistan time; separate from poetry/bayan workflow

permissions:
  contents: write

concurrency:
  group: authorized-creator-video-queue
  cancel-in-progress: false

jobs:
  queue-creator-video:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install requests
      - name: Validate and queue one authorized creator video
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_CHANNEL_ID: ${{ secrets.BUFFER_CHANNEL_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          gh auth setup-git
          python creator_video_queue.py
      - name: Save duplicate-prevention history
        if: success()
        run: |
          if git diff --quiet -- creator_videos/posted.json; then
            echo "No new video was queued; no history update."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add creator_videos/posted.json
            git commit -m "Record queued creator video"
            git push
          fi
